name: .NET build, test, and publish

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Setup NuGet sources
        run: |
          dotnet nuget add source --name "github-packages" --username "${{ github.repository_owner }}" --password "${{ secrets.GITHUB_TOKEN }}" --store-password-in-clear-text "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"

      - name: Restore dependencies (wait for upstream NuGet indexing)
        run: |
          elapsed=0
          until dotnet restore Glacier.Cluster.slnx --no-cache > /dev/null 2>&1; do
            if [ $elapsed -ge 1200 ]; then
              dotnet restore Glacier.Cluster.slnx --no-cache
              exit 1
            fi
            echo "Waiting for upstream NuGet packages to index (${elapsed}s elapsed)..."
            sleep 30
            elapsed=$((elapsed+30))
          done

      - name: Build
        run: dotnet build Glacier.Cluster.slnx --configuration Release --no-restore

      - name: Run tests
        run: dotnet test tests/Glacier.Cluster.Tests/Glacier.Cluster.Tests.csproj --configuration Release --no-build --blame-hang --blame-hang-dump-type none --blame-hang-timeout 60s

      - name: Pack Library
        run: dotnet pack src/Glacier.Cluster/Glacier.Cluster.csproj --configuration Release --no-build --output packages

      - name: NuGet login (OIDC Trusted Publishing)
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/'))
        uses: NuGet/login@v1
        id: login
        with:
          user: spuriousbugfix

      - name: Publish to nuget.org
        if: steps.login.outputs.NUGET_API_KEY != ''
        run: dotnet nuget push "packages/*.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Publish to GitHub Packages
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/'))
        run: dotnet nuget push "packages/*.nupkg" --api-key "${{ secrets.GITHUB_TOKEN }}" --source "github-packages" --skip-duplicate
